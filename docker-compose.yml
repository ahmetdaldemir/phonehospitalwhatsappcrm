version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phone_hospital_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - phone_hospital_network
      - database_stack_network
    environment:
      - DB_HOST=${DB_HOST:-global_mysql}
      - DB_PORT=${DB_PORT:-3306}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}

  nginx:
    image: nginx:alpine
    container_name: phone_hospital_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - phone_hospital_network
    depends_on:
      - app

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phone_hospital_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - phone_hospital_network
      - database_stack_network
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      - DB_HOST=${DB_HOST:-global_mysql}
      - DB_PORT=${DB_PORT:-3306}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phone_hospital_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - phone_hospital_network
      - database_stack_network
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"
    environment:
      - DB_HOST=${DB_HOST:-global_mysql}
      - DB_PORT=${DB_PORT:-3306}

networks:
  phone_hospital_network:
    driver: bridge
  database_stack_network:
    external: true
    name: ${EXTERNAL_NETWORK_NAME:-docker-datatabse-stack_default}


